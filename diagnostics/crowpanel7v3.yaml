# Hand-written bench entry, not a generated catalogue entry.
# Keep diagnostics/secrets.yaml local. See docs/CROWPANEL7V3.md.
substitutions:
  FONT_DIR: "https://raw.githubusercontent.com/sviluppatore/homeassistant_espscreen/crowpanel-7-v3/fonts"
  CALIBRATION_ON_BOOT: "true"

packages:
  core: !include ../packages/core.yaml
  board: !include ../packages/boards/crowpanel-7-v3.yaml

external_components:
  - source:
      type: git
      url: https://github.com/sviluppatore/homeassistant_espscreen.git
      ref: crowpanel-7-v3
      path: components
    refresh: 0s
    components: [smart_display, flash_layout, crowpanel_v3]

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
